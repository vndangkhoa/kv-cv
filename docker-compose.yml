services:
  kv-cv:
    image: vndangkhoa/kv-cv:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kv-cv
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
